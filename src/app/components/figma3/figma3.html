<div class="header flex flex-col gap-5 mt-15">
    <div class="title">Practice Advice</div>
    <h2 class="m-0 f-s-40">Our Popular Courses</h2>
    <p class="m-0 description flex flex-col"><span>Problems trying to resolve the conflict between </span>the two major realms of Classical physics: Newtonian
        mechanics </p>
</div>

<div class="card-container gap-12 flex">
    @for(data of cardData; track data){
        <mat-card class="example-card px-15 py-13 gap-10" appearance="outlined">
            <div mat-card-avatar class="example-header-image"></div>
            <div class="card-title f-s-16 f-w-700">{{data.title}}</div>
            <div class="pending-line"></div>
            <p class="m-0 card-content">{{data.content}}</p>
        </mat-card>
    }
</div>
